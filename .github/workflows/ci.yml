name: CI
on:
  push:
  pull_request:
    branches: [ main ]
jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - run: npm ci
    - name: Typecheck
      run: npm run typecheck
    - name: Unit tests
      run: npm test
    - name: Build
      run: npm run build
