<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bicho.exe Playable Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.px{font-family:'Pixelify Sans',sans-serif}
.mv{transition:left .9s steps(9),top .9s steps(9)}
.bare{background:none;border:0;padding:0;margin:0;cursor:pointer;font:inherit;color:inherit}
.bare:focus-visible,.pill:focus-visible,.vtab:focus-visible,.tool:focus-visible,.tube:focus-visible,.w98:focus-visible{outline:3px solid #FF4FA3;outline-offset:2px}
.ico{position:absolute;width:86px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px}
.lab{font-family:'Atkinson Hyperlegible',sans-serif;font-size:12px;line-height:1.15;background:#000080;color:#fff;padding:1px 5px;text-align:center}
.glass{position:absolute;left:14px;width:362px;box-sizing:border-box;background:#C0C0C0;box-shadow:inset -1px -1px 0 #0A0A0A,inset 1px 1px 0 #FFFFFF,inset -2px -2px 0 #808080,inset 2px 2px 0 #DFDFDF,4px 4px 0 rgba(0,0,0,0.35);padding:3px;overflow:hidden}
.gt{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 3px 0 6px;background:linear-gradient(90deg,#000080,#0A5CC0);color:#fff;font-family:'Pixelify Sans',sans-serif;font-size:16px;font-weight:600;text-shadow:-0.6px 0 rgba(0,229,229,0.7),0.6px 0 rgba(255,31,169,0.7)}
.gt i{display:block;width:18px;height:16px;margin-left:2px;background:#C0C0C0;box-shadow:inset -1px -1px 0 #0A0A0A,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080}
.gc{padding:8px 12px;color:#000;font-family:'Atkinson Hyperlegible',sans-serif;background:#C0C0C0}
.pill{flex:1;min-height:52px;box-sizing:border-box;border:0;background:#C0C0C0;box-shadow:inset -1px -1px 0 #0A0A0A,inset 1px 1px 0 #FFFFFF,inset -2px -2px 0 #808080,inset 2px 2px 0 #DFDFDF;color:#000;font-family:'Pixelify Sans',sans-serif;font-size:18px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer;padding:0 4px}
.pill:active{box-shadow:inset 1px 1px 0 #0A0A0A,inset -1px -1px 0 #FFFFFF,inset 2px 2px 0 #808080,inset -2px -2px 0 #DFDFDF}
.w98b{box-sizing:border-box;min-height:38px;padding:0 10px;display:flex;align-items:center;gap:6px;background:#C0C0C0;box-shadow:inset -1px -1px 0 #0A0A0A,inset 1px 1px 0 #FFFFFF,inset -2px -2px 0 #808080,inset 2px 2px 0 #DFDFDF;font-family:'Pixelify Sans',sans-serif;font-size:16px;font-weight:700;color:#000;text-decoration:none;border:0;cursor:pointer}
.pill small{font-family:'Atkinson Hyperlegible',sans-serif;font-size:12px;font-weight:400}
.stat{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:4px;min-height:22px}
.stat b{width:64px;font-family:'Pixelify Sans',sans-serif;font-weight:600;font-size:16px}
.blk{display:flex;gap:3px}
.blk i{display:block;width:20px;height:14px}
.vtab{position:absolute;width:36px;height:104px;box-sizing:border-box;border:0;border-radius:8px 0 0 8px;background:#C0C0C0;box-shadow:inset -2px -2px 0 #808080,inset 2px 2px 0 #FFFFFF,-3px 3px 0 rgba(11,42,74,0.35);writing-mode:vertical-rl;font-family:'Pixelify Sans',sans-serif;font-size:17px;font-weight:600;color:#0B2A4A;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;z-index:30}
.w98{background:#C0C0C0;box-shadow:inset -1px -1px 0 #0A0A0A,inset 1px 1px 0 #FFFFFF,inset -2px -2px 0 #808080,inset 2px 2px 0 #DFDFDF,-5px 5px 16px rgba(11,42,74,0.45)}
.w98t{height:28px;background:linear-gradient(90deg,#00006E,#0A58B8);color:#fff;font-family:'Pixelify Sans',sans-serif;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 8px;margin:3px 3px 0}
.w98x{width:22px;height:20px;border:0;background:#C0C0C0;box-shadow:inset -1px -1px 0 #0A0A0A,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080;font-family:'Pixelify Sans',sans-serif;font-size:14px;color:#0A0A0A;cursor:pointer;padding:0;line-height:1}
.sheet{padding:6px 6px 0 6px;display:flex;gap:2px;margin-top:6px}
.sheet button{min-height:30px;padding:0 10px;border:0;background:#C0C0C0;box-shadow:inset 1px 1px 0 #fff,inset -1px 0 0 #808080;border-radius:4px 4px 0 0;font-family:'Pixelify Sans',sans-serif;font-size:15px;font-weight:600;color:#0A0A0A;cursor:pointer}
.paper{display:block;box-sizing:border-box;width:100%;border:0;resize:none;outline:none;font-family:'Courier Prime',monospace;font-size:16px;line-height:26px;color:#0B2A4A;background:repeating-linear-gradient(0deg,#FFFFFF 0 25px,#B8D0F0 25px 26px);padding:2px 10px 0 12px;background-attachment:local}
.tool{width:56px;height:52px;box-sizing:border-box;border:3px solid #0B2A4A;border-radius:12px;background:#FFFFFF;box-shadow:0 3px 0 #0B2A4A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;padding:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;color:#0B2A4A;line-height:1}
.tube{width:38px;height:44px;box-sizing:border-box;border:3px solid #0B2A4A;border-radius:8px;cursor:pointer;padding:0;position:relative}
.tube::after{content:"";position:absolute;left:4px;top:3px;width:6px;height:30px;border-radius:3px;background:rgba(255,255,255,0.45)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 1.1s steps(2) infinite}
@media (prefers-reduced-motion:reduce){.bob{animation:none}.mv{transition:none}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:{{skyBg}};font-family:'Atkinson Hyperlegible',sans-serif;color:#0B2A4A">

<div style="position:absolute;left:0;top:0"><dc-import name="collage" w="390" h="844" fx="{{fxMode}}" mood="{{weird}}" look-x="{{sunX}}" look-y="{{sunY}}" hint-size="390px,844px"></dc-import></div>

<div class="glass" style="top:12px">
<div class="gt"><span>Examen.exe</span><span style="display:flex"><i></i></span></div>
<div class="gc" style="display:flex;gap:14px;align-items:center;padding:6px 12px">
<div style="text-align:center;flex:none"><div class="px" style="font-size:44px;font-weight:700;line-height:0.9;color:#2A5CE6">9</div><div class="px" style="font-size:15px">días</div></div>
<div style="flex:1"><div style="font-size:13px;margin-bottom:3px">Test-ready: 62%</div><div style="height:18px;background:#fff;box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff;padding:2px;box-sizing:border-box"><i style="display:block;width:62%;height:100%;background:repeating-linear-gradient(90deg,#000080 0 9px,transparent 9px 12px)"></i></div></div>
</div>
</div>

<div style="position:absolute;left:14px;top:134px;width:330px;min-height:34px;box-sizing:border-box;background:{{hintBg}};color:#0B2A4A;padding:5px 12px;font-size:13.5px;line-height:1.3;display:flex;align-items:center;border:1px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,0.4)" aria-live="polite">{{hint}}</div>

<sc-for list="{{icons}}" as="ic" hint-placeholder-count="6">
<button type="button" class="bare ico mv" onClick="{{ic.tap}}" style="{{ic.style}}" aria-label="{{ic.aria}}">
<svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true" style="filter:drop-shadow(0 3px 3px rgba(11,42,74,0.35))">
<sc-if value="{{ic.k1}}" hint-placeholder-val="{{true}}"><circle cx="20" cy="20" r="16" fill="#EF3B2D"/></sc-if>
<sc-if value="{{ic.k1}}" hint-placeholder-val="{{true}}"><ellipse cx="14" cy="13" rx="6" ry="4" fill="#fff" opacity="0.6"/></sc-if>
<sc-if value="{{ic.k2}}" hint-placeholder-val="{{false}}"><path d="M20 4l15 8-15 8-15-8z" fill="#FFE766"/></sc-if>
<sc-if value="{{ic.k2}}" hint-placeholder-val="{{false}}"><path d="M5 12l15 8v16L5 28z" fill="#FFD21F"/></sc-if>
<sc-if value="{{ic.k2}}" hint-placeholder-val="{{false}}"><path d="M35 12l-15 8v16l15-8z" fill="#E0AA00"/></sc-if>
<sc-if value="{{ic.k3}}" hint-placeholder-val="{{false}}"><path d="M20 3l14 30H6z" fill="#2A5CE6"/></sc-if>
<sc-if value="{{ic.k3}}" hint-placeholder-val="{{false}}"><path d="M20 3l14 30h-9z" fill="#1B3FA8"/></sc-if>
<sc-if value="{{ic.k3}}" hint-placeholder-val="{{false}}"><path d="M18 8l-8 20" stroke="#fff" opacity="0.5" stroke-width="3"/></sc-if>
<sc-if value="{{ic.k4}}" hint-placeholder-val="{{false}}"><path d="M20 4l16 28H4z" fill="#A468E8"/></sc-if>
<sc-if value="{{ic.k4}}" hint-placeholder-val="{{false}}"><path d="M20 4l16 28-16-6z" fill="#7B3FBF"/></sc-if>
<sc-if value="{{ic.k5}}" hint-placeholder-val="{{false}}"><path d="M8 10v20a12 5 0 0 0 24 0V10a12 5 0 0 1-24 0z" fill="#7BD43B"/></sc-if>
<sc-if value="{{ic.k5}}" hint-placeholder-val="{{false}}"><ellipse cx="20" cy="10" rx="12" ry="5" fill="#C5F57E"/></sc-if>
<sc-if value="{{ic.k6}}" hint-placeholder-val="{{false}}"><path d="M8 10h24l-3 26H11z" fill="#CFEFFF" fill-opacity="0.85" stroke="#0B2A4A" stroke-width="1.5"/></sc-if>
<sc-if value="{{ic.k6}}" hint-placeholder-val="{{false}}"><path d="M6 10h28M16 5h8" stroke="#0B2A4A" stroke-width="2.5" stroke-linecap="round"/></sc-if>
</svg>
<span class="lab">{{ic.label}}</span>
</button>
</sc-for>

<a class="bare ico" href="h-bicho-games.dc.html" style="left:186px;top:282px;text-decoration:none" aria-label="Juegos.exe, mini games to learn Spanish">
<svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true" style="filter:drop-shadow(0 3px 3px rgba(11,42,74,0.35))"><rect x="3" y="12" width="34" height="18" rx="8" fill="#A468E8" stroke="#0B2A4A" stroke-width="2"/><path d="M11 17v8M7 21h8" stroke="#fff" stroke-width="3"/><circle cx="26" cy="20" r="2.6" fill="#FFD21F" stroke="#0B2A4A"/><circle cx="31" cy="24" r="2.6" fill="#EF3B2D" stroke="#0B2A4A"/></svg>
<span class="lab">Juegos.exe</span></a>

<div class="glass" style="top:552px">
<div class="gt"><span>Cuidar a Bicho.exe</span><span style="display:flex"><i></i></span></div>
<div class="gc" style="padding:8px 12px 10px">
<sc-for list="{{stats}}" as="st" hint-placeholder-count="3">
<div class="stat"><b>{{st.name}}</b><span class="blk"><sc-for list="{{st.blocks}}" as="bl" hint-placeholder-count="5"><i style="{{bl.style}}"></i></sc-for></span><span style="font-size:12px;color:#31506E">{{st.note}}</span></div>
</sc-for>
<div style="display:flex;gap:8px;margin-top:6px">
<button type="button" class="pill" onClick="{{feed}}">Comer<small>listen</small></button>
<button type="button" class="pill" onClick="{{play}}">Jugar<small>speed</small></button>
<button type="button" class="pill" onClick="{{sleep}}">Dormir<small>rest</small></button>
</div>
<label style="display:flex;align-items:center;gap:8px;min-height:36px;margin-top:6px;font-size:14px"><input type="checkbox" checked="{{loose}}" onChange="{{toggleLoose}}" disabled="{{noMotion}}" style="width:20px;height:20px;margin:0"> Soltar a Bicho (hace travesuras solo)</label>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:46px;background:#C0C0C0;border-top:2px solid #FFFFFF;box-shadow:inset 0 1px 0 #DFDFDF;display:flex;align-items:center;gap:4px;padding:0 3px;box-sizing:border-box;z-index:20">
<div class="w98b"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="8" r="7" fill="#2FA8DC" stroke="#000"/><circle cx="7" cy="7" r="1.6" fill="#fff"/><circle cx="13" cy="7" r="1.6" fill="#fff"/><path d="M6 17l2-4M14 17l-2-4" stroke="#000" stroke-width="1.5"/></svg>Inicio</div>
<a class="w98b" href="h-bicho-games.dc.html"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="6" width="18" height="10" rx="4" fill="#A468E8" stroke="#000"/><path d="M5 9v4M3 11h4" stroke="#fff" stroke-width="1.5"/><circle cx="13" cy="10" r="1.3" fill="#FFD21F"/><circle cx="16" cy="12" r="1.3" fill="#EF3B2D"/></svg>Juegos</a>
<div style="flex:1"></div>
<div class="px" style="min-height:34px;padding:0 10px;display:flex;align-items:center;box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff;font-size:14px;font-weight:600">{{coins}} monedas · {{clock}}</div>
</div>

<svg width="150" height="130" viewBox="0 0 150 130" style="position:absolute;left:-6px;top:640px;pointer-events:none;opacity:{{fernOp}}" aria-hidden="true">
<path d="M0 130Q30 60 120 20" fill="none" stroke="#1F7A2E" stroke-width="22" stroke-dasharray="2 7"/>
<path d="M0 130Q40 80 100 60" fill="none" stroke="#3FAE3B" stroke-width="18" stroke-dasharray="2 7"/>
</svg>

<sc-if value="{{showDraw}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;left:10px;top:100px;width:340px;height:524px;box-sizing:border-box;border:4px solid #0B2A4A;border-radius:18px;background:#9ADBFF;box-shadow:0 8px 0 rgba(11,42,74,0.45);overflow:hidden;z-index:20">
<div style="height:36px;background:linear-gradient(90deg,#EF3B2D,#FF8A1F,#FFD21F,#7BD43B,#2A5CE6,#A468E8);border-bottom:4px solid #0B2A4A;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px">
<span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;line-height:1;color:#fff;-webkit-text-stroke:3px #0B2A4A;paint-order:stroke fill">Garabatos</span>
<button type="button" class="bare" onClick="{{closePanel}}" aria-label="Close drawing pad" style="width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#FF9A8A 40%,#E23B2B);border:2.5px solid #0B2A4A;font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;line-height:1;color:#0B2A4A">x</button>
</div>
<div style="display:flex;gap:8px;padding:8px 8px 0 8px">
<div style="display:flex;flex-direction:column;gap:5px;flex:none">
<sc-for list="{{tools}}" as="tl" hint-placeholder-count="5">
<button type="button" class="tool" onClick="{{tl.tap}}" style="{{tl.style}}" aria-label="{{tl.aria}}" aria-pressed="{{tl.sel}}">
<sc-if value="{{tl.i1}}" hint-placeholder-val="{{true}}"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27l3-9 15-15 6 6-15 15z" fill="#FFD21F" stroke="#0B2A4A" stroke-width="2" stroke-linejoin="round"/><path d="M5 27l3-9 6 6z" fill="#F4C79A" stroke="#0B2A4A" stroke-width="2" stroke-linejoin="round"/></svg></sc-if>
<sc-if value="{{tl.i2}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M26 4L15 15" stroke="#0B2A4A" stroke-width="5" stroke-linecap="round"/><path d="M26 4L15 15" stroke="#EF3B2D" stroke-width="2.5" stroke-linecap="round"/><path d="M15 15c-5 0-6 5-10 7 5 3 12 3 14-3z" fill="#2A5CE6" stroke="#0B2A4A" stroke-width="2" stroke-linejoin="round"/></svg></sc-if>
<sc-if value="{{tl.i3}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="12" width="12" height="16" rx="3" fill="#7BD43B" stroke="#0B2A4A" stroke-width="2"/><rect x="12" y="6" width="6" height="6" fill="#fff" stroke="#0B2A4A" stroke-width="2"/><circle cx="24" cy="7" r="1.5" fill="#0B2A4A"/><circle cx="28" cy="11" r="1.5" fill="#0B2A4A"/><circle cx="26" cy="3" r="1.5" fill="#0B2A4A"/></svg></sc-if>
<sc-if value="{{tl.i4}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 20l12-12 10 10-8 8H10z" fill="#FF9AD0" stroke="#0B2A4A" stroke-width="2" stroke-linejoin="round"/><path d="M11 13l10 10" stroke="#0B2A4A" stroke-width="2"/></svg></sc-if>
<sc-if value="{{tl.i5}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4l11 6-11 6-11-6z" fill="#FFE766" stroke="#0B2A4A" stroke-width="2" stroke-linejoin="round"/><path d="M5 10v11l11 6V16z" fill="#FFD21F" stroke="#0B2A4A" stroke-width="2" stroke-linejoin="round"/><path d="M27 10v11l-11 6V16z" fill="#E0AA00" stroke="#0B2A4A" stroke-width="2" stroke-linejoin="round"/></svg></sc-if>
<span>{{tl.label}}</span>
</button>
</sc-for>
<button type="button" class="tool" onClick="{{undo}}" aria-label="Undo last mark" style="background:#FFE766"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 8L5 15l7 7M5 15h14a8 8 0 0 1 0 16" transform="translate(0 -6)" fill="none" stroke="#0B2A4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Deshacer</span></button>
<button type="button" class="tool" onClick="{{wipe}}" aria-label="Clear the whole page" style="background:#FFB3A8"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 9h16l-2 18H10z" fill="#fff" stroke="#0B2A4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M6 9h20M13 5h6" stroke="#0B2A4A" stroke-width="2.5" stroke-linecap="round"/></svg><span>Borrar</span></button>
</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center">
<div style="border:3px solid #0B2A4A;background:#fff;box-shadow:3px 3px 0 rgba(11,42,74,0.5);line-height:0">
<canvas width="244" height="372" ref="{{setCv}}" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pUp}}" style="display:block;touch-action:none;cursor:crosshair;width:244px;height:372px"></canvas>
</div>
</div>
</div>
<div style="display:flex;gap:3px;padding:8px 8px 0 8px;justify-content:center">
<sc-for list="{{palette}}" as="pc" hint-placeholder-count="8">
<button type="button" class="tube" onClick="{{pc.tap}}" style="{{pc.style}}" aria-label="{{pc.aria}}" aria-pressed="{{pc.sel}}"></button>
</sc-for>
</div>
<div style="text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;color:#0B2A4A;margin-top:5px">Se queda en tu dispositivo · stays on your device</div>
</div>
</sc-if>

<sc-if value="{{showNotes}}" hint-placeholder-val="{{false}}">
<div class="w98" style="position:absolute;right:0;top:80px;width:252px;height:690px;box-sizing:border-box;display:flex;flex-direction:column;z-index:20">
<div class="w98t"><span>Apuntes</span><button type="button" class="w98x" onClick="{{closePanel}}" aria-label="Close notes">X</button></div>
<div class="sheet">
<sc-for list="{{pages}}" as="pg" hint-placeholder-count="3">
<button type="button" onClick="{{pg.tap}}" style="{{pg.style}}" aria-pressed="{{pg.sel}}">{{pg.label}}</button>
</sc-for>
</div>
<div style="margin:0 6px;flex:1;background:#fff;box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff,inset 2px 2px 0 #0A0A0A;padding:2px;display:flex;min-height:0">
<textarea class="paper" value="{{noteText}}" onChange="{{onNote}}" spellcheck="false" aria-label="Notes page" style="flex:1;height:100%"></textarea>
</div>
<div style="margin:6px;height:24px;box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff;font-family:'Pixelify Sans',sans-serif;font-size:13.5px;color:#0A0A0A;display:flex;align-items:center;padding:0 8px;box-sizing:border-box">Se guarda en este dispositivo</div>
</div>
</sc-if>

<div class="mv" style="{{bStyle}};z-index:25">
<button type="button" class="bare" onClick="{{tapBicho}}" aria-label="Bicho, your tutor. Tap to say hi." style="display:block">
<div>
<dc-import name="bicho" mood="{{mood}}" size="80" look="{{look}}" halo="{{halo}}" hint-size="80px,87px"></dc-import>
</div>
</button>
</div>

<sc-if value="{{hasSay}}" hint-placeholder-val="{{true}}">
<div style="{{bubbleStyle}};z-index:26">
<div class="px" style="font-size:17px;line-height:1.15;font-weight:600">{{sayEs}}</div>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{true}}"><div style="font-size:12.5px;color:#31506E;margin-top:2px">{{sayEn}}</div></sc-if>
</div>
</sc-if>

<button type="button" class="vtab" onClick="{{toggleNotes}}" style="{{tabNotesStyle}}" aria-label="Open or close the notes side tab">Apuntes</button>
<button type="button" class="vtab" onClick="{{toggleDraw}}" style="{{tabDrawStyle}}" aria-label="Open or close the drawing pad">Garabatos</button>

<div style="position:absolute;left:0;top:0;z-index:50;pointer-events:none"><dc-import name="fx" w="390" h="844" mood="{{weird}}" stamp-b="52" hint-size="390px,844px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"weird":{"editor":"enum","options":["cozy","odd","haunted"],"default":"odd","section":"Weirdness"},"$preview":{"width":390,"height":844}}'>
const ICONS = [
  { id: 'p1', x: 10, y: 182, label: 'Pregunta1.txt', n: 1, kind: 'k1' },
  { id: 'p2', x: 98, y: 182, label: 'Pregunta2.txt', n: 2, kind: 'k2' },
  { id: 'p3', x: 186, y: 182, label: 'Pregunta3.txt', n: 3, kind: 'k3' },
  { id: 'p4', x: 274, y: 182, label: 'Pregunta4.txt', n: 4, kind: 'k4' },
  { id: 'p5', x: 10, y: 282, label: 'Pregunta5.txt', n: 5, kind: 'k5' },
  { id: 'bin', x: 98, y: 282, label: 'Papelera', bin: true, kind: 'k6' }
];
const CHAT = [
  ['¡Hola! ¿Qué tal?', 'Hi! How is it going?'],
  ['¿Practicamos un poco?', 'Shall we practise a bit?'],
  ['Tengo hambre de palabras.', 'I am hungry for words.'],
  ['No me mires así.', 'Do not look at me like that.'],
  ['Hoy hablas tú.', 'Today, you talk.']
];
const PALETTE = ['#0B2A4A', '#EF3B2D', '#FF8A1F', '#FFD21F', '#7BD43B', '#2A5CE6', '#A468E8', '#FF5FA8'];
const PNAMES = ['black', 'red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink'];
const TOOLS = [
  { id: 'pencil', label: 'Lápiz' }, { id: 'brush', label: 'Pincel' }, { id: 'spray', label: 'Spray' },
  { id: 'eraser', label: 'Goma' }, { id: 'stamp', label: 'Sello' }
];
const PAGES = [{ id: 'n1', label: 'Notas' }, { id: 'n2', label: 'Palabras' }, { id: 'n3', label: 'Dudas' }];
const NOTES0 = {
  n1: '¿Qué haces en tu tiempo libre?\n\n- juego a videojuegos\n- leo manga\n- OJO: la j suena como h\n',
  n2: 'tiempo libre = free time\nme gusta = I like\njuego = I play\nleo = I read\n',
  n3: 'Cuándo uso "a" con jugar?\nPreguntar en clase.\n'
};
const OUTLINE_SKY = 'linear-gradient(180deg,#4FA9F0 0%,#9AD6FF 55%,#DDF3FF 70%)';
const DEF = { bx: 150, by: 400, flip: 1, mode: 'idle', sayEs: '¡Hola! ¿Qué tal?', sayEn: 'Hi! How is it going?', ttl: 3, flash: '', carry: null, moved: {}, stolen: null, target: null, hunger: 3, joy: 3, energy: 4, coins: 12, glitch: false, n: 0, napT: 0, happy: 0, panel: null, loose: false, page: 'n1', notes: NOTES0, tool: 'pencil', color: '#0B2A4A', stamp: 0 };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

class Component extends DCLogic {
  S() { return Object.assign({}, DEF, this.state || {}); }
  componentDidMount() {
    this._reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    try { const raw = localStorage.getItem('bicho-notes'); if (raw) this.setState({ notes: Object.assign({}, NOTES0, JSON.parse(raw)) }); } catch (e) {}
    if (!this._reduce) this._t = setInterval(() => this.tick(), 2400);
  }
  componentWillUnmount() { if (this._t) clearInterval(this._t); }

  tick(manual) {
    const s = this.S();
    if (!s.loose && !manual) return;
    const weird = this.props.weird || 'odd';
    const p = { n: s.n + 1, glitch: false };
    if (s.happy > 0) p.happy = s.happy - 1;
    if (s.ttl > 0) { p.ttl = s.ttl - 1; } else { p.sayEs = ''; p.sayEn = ''; p.flash = ''; }
    if (s.panel) { this.setState(p); return; }
    if (s.n % 7 === 6) p.hunger = Math.max(1, s.hunger - 1);
    if (s.n % 9 === 8) p.joy = Math.max(1, s.joy - 1);
    if (s.n % 11 === 10) p.energy = Math.max(2, s.energy - 1);
    if (s.mode === 'goto') {
      p.carry = s.target; p.mode = 'carry';
      p.bx = rnd(20, 250); p.by = rnd(330, 460);

    } else if (s.mode === 'carry') {
      const moved = Object.assign({}, s.moved);
      moved[s.carry] = { x: clamp(s.bx - 10, 10, 274), y: clamp(s.by - 24, 176, 470) };
      p.moved = moved; p.stolen = s.carry; p.carry = null; p.mode = 'idle';
      p.sayEs = '¡A que no me pillas!'; p.sayEn = 'Bet you cannot catch me!'; p.ttl = 3;
    } else if (s.mode === 'nap') {
      if (s.napT > 1) { p.mode = 'idle'; p.napT = 0; p.sayEs = '¡Qué bien dormí!'; p.sayEn = 'What a nap!'; p.ttl = 2; }
      else p.napT = s.napT + 1;
    } else if (s.mode === 'peek' || s.mode === 'eat') {
      p.mode = 'idle'; p.bx = rnd(20, 250); p.by = rnd(180, 440);
    } else {
      const r = Math.random();
      const free = ICONS.filter(i => !i.bin && !s.moved[i.id]);
      if (!s.stolen && free.length && r < 0.38) {
        const t = free[rnd(0, free.length - 1)];
        p.mode = 'goto'; p.target = t.id; p.bx = clamp(t.x + 4, 6, 262); p.by = t.y + 22;
      } else if (r < 0.62) {

      } else if (r < 0.76) {

      } else {
        const c = CHAT[rnd(0, CHAT.length - 1)]; p.sayEs = c[0]; p.sayEn = c[1]; p.ttl = 3;
      }
    }
    this.setState(p);
  }

  tapBicho() {
    const s = this.S();
    if (this._reduce || !s.loose) { this.setState({ joy: Math.min(5, s.joy + 1), happy: 2 }); this.tick(true); return; }
    const p = { joy: Math.min(5, s.joy + 1), ttl: 3, happy: 2 };
    if (s.mode === 'nap') { p.mode = 'idle'; p.sayEs = '¡Ay! Estaba durmiendo.'; p.sayEn = 'Ow! I was sleeping.'; }
    else { const c = CHAT[rnd(0, CHAT.length - 1)]; p.sayEs = c[0]; p.sayEn = c[1]; }
    this.setState(p);
  }
  tapIcon(id) {
    const s = this.S();
    const ic = ICONS.find(i => i.id === id);
    if (s.stolen === id && !s.carry) {
      const moved = Object.assign({}, s.moved); delete moved[id];
      this.setState({ moved: moved, stolen: null, mode: 'idle', happy: 2, bx: clamp(ic.x + 8, 10, 262), by: ic.y + 24, coins: s.coins + 5, sayEs: '¡Vale, vale! Toma.', sayEn: 'Fine, fine! Here.', flash: 'Got ' + ic.label + ' back. +5 monedas. Now open it and say your answer.', ttl: 4 });
    } else if (s.carry === id) {
      this.setState({ sayEs: '¡Es mío!', sayEn: 'It is mine!', ttl: 2 });
    } else if (ic.bin) {
      this.setState({ sayEs: 'Ahí viven los errores. Son útiles.', sayEn: 'That is where mistakes live. They are useful.', ttl: 3 });
    } else {
      this.setState({ sayEs: 'Pregunta ' + ic.n + '. ¿Empezamos?', sayEn: 'Question ' + ic.n + '. Shall we start?', ttl: 3 });
    }
  }
  toggleLoose() { if (this._reduce) return; this.setState({ loose: !this.S().loose }); }
  feed() { const s = this.S(); this.setState({ mode: 'eat', hunger: Math.min(5, s.hunger + 1), coins: s.coins + 1, bx: 150, by: 470, sayEs: '¡Ñam! Palabras ricas.', sayEn: 'Yum! Tasty words.', ttl: 2 }); }
  play() { const s = this.S(); this.setState({ mode: 'idle', joy: Math.min(5, s.joy + 1), bx: rnd(10, 262), by: rnd(180, 440), sayEs: '¡Más rápido!', sayEn: 'Faster!', ttl: 2 }); }
  sleep() { this.setState({ mode: 'nap', napT: 0, energy: 5, bx: 262, by: 480, sayEs: 'Zzz… mañana repaso.', sayEn: 'Zzz… I will revise tomorrow.', ttl: 3 }); }

  snap() { if (this._cv) { try { this._saved = this._cv.toDataURL(); } catch (e) {} } }
  openPanel(name) {
    const s = this.S();
    if (s.panel === name) { this.closePanel(); return; }
    this.snap();
    const p = { panel: name, ttl: 2, mode: 'idle', carry: s.carry };
    if (name === 'draw') { p.bx = 224; p.by = 28; p.sayEs = '¡Dibuja algo!'; p.sayEn = 'Draw something!'; }
    else { p.bx = 40; p.by = 24; p.sayEs = 'Apunta las palabras nuevas.'; p.sayEn = 'Write down the new words.'; }
    this.setState(p);
  }
  closePanel() { this.snap(); this.setState({ panel: null, mode: 'idle', bx: 150, by: 400, sayEs: 'Vale, sigo a lo mío.', sayEn: 'Okay, back to my business.', ttl: 2 }); }

  setPage(id) { this.setState({ page: id }); }
  onNote(e) {
    const s = this.S();
    const notes = Object.assign({}, s.notes); notes[s.page] = e.target.value;
    this.setState({ notes: notes });
    try { localStorage.setItem('bicho-notes', JSON.stringify(notes)); } catch (err) {}
  }

  setCv(el) {
    if (!el || el === this._cv) return;
    this._cv = el; this._ctx = el.getContext('2d'); this._undo = [];
    const c = this._ctx; c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, el.width, el.height);
    let src = this._saved || null;
    if (!src) { try { src = localStorage.getItem('bicho-doodle'); } catch (e) { src = null; } }
    if (src) { const img = new Image(); img.onload = () => c.drawImage(img, 0, 0); img.src = src; }
  }
  pt(e) {
    const r = this._cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (this._cv.width / r.width), y: (e.clientY - r.top) * (this._cv.height / r.height) };
  }
  pDown(e) {
    if (!this._ctx) return;
    const c = this._ctx;
    this._undo.push(c.getImageData(0, 0, this._cv.width, this._cv.height));
    if (this._undo.length > 12) this._undo.shift();
    this._last = this.pt(e);
    if (e.target.setPointerCapture) { try { e.target.setPointerCapture(e.pointerId); } catch (err) {} }
    if (this.S().tool === 'stamp') { this.stampAt(this._last); this._drawing = false; return; }
    this._drawing = true; this.dab(this._last, this._last);
  }
  pMove(e) { if (!this._drawing) return; const p = this.pt(e); this.dab(this._last, p); this._last = p; }
  pUp() {
    if (this._drawing) this._drawing = false;
    if (this._cv) { try { localStorage.setItem('bicho-doodle', this._cv.toDataURL()); } catch (e) {} }
  }
  dab(a, b) {
    const c = this._ctx; const s = this.S(); const t = s.tool;
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (t === 'spray') {
      c.fillStyle = s.color;
      for (let i = 0; i < 16; i++) { const ang = Math.random() * 6.283; const r = Math.random() * 14; c.fillRect(b.x + Math.cos(ang) * r, b.y + Math.sin(ang) * r, 1.7, 1.7); }
      return;
    }
    c.strokeStyle = t === 'eraser' ? '#FFFFFF' : s.color;
    c.lineWidth = t === 'pencil' ? 2.5 : t === 'brush' ? 10 : 18;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x + 0.01, b.y); c.stroke();
  }
  stampAt(p) {
    const c = this._ctx; const k = this.S().stamp % 4;
    const poly = (pts, col) => { c.fillStyle = col; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); c.fill(); };
    if (k === 0) {
      const g = c.createRadialGradient(p.x - 5, p.y - 6, 2, p.x, p.y, 18);
      g.addColorStop(0, '#FFB3A8'); g.addColorStop(0.5, '#EF3B2D'); g.addColorStop(1, '#8F170C');
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, 18, 0, 6.283); c.fill();
    } else if (k === 1) {
      poly([[p.x, p.y - 18], [p.x + 18, p.y - 9], [p.x, p.y], [p.x - 18, p.y - 9]], '#FFE766');
      poly([[p.x - 18, p.y - 9], [p.x, p.y], [p.x, p.y + 20], [p.x - 18, p.y + 11]], '#FFD21F');
      poly([[p.x + 18, p.y - 9], [p.x, p.y], [p.x, p.y + 20], [p.x + 18, p.y + 11]], '#E0AA00');
    } else if (k === 2) {
      poly([[p.x, p.y - 20], [p.x + 16, p.y + 16], [p.x - 16, p.y + 16]], '#2A5CE6');
      poly([[p.x, p.y - 20], [p.x + 16, p.y + 16], [p.x + 4, p.y + 16]], '#1B3FA8');
    } else {
      poly([[p.x, p.y - 20], [p.x + 18, p.y + 14], [p.x - 18, p.y + 14]], '#A468E8');
      poly([[p.x, p.y - 20], [p.x + 18, p.y + 14], [p.x, p.y + 8]], '#7B3FBF');
    }
  }
  undoOne() { if (this._ctx && this._undo && this._undo.length) this._ctx.putImageData(this._undo.pop(), 0, 0); }
  wipe() {
    if (!this._ctx) return;
    this._undo.push(this._ctx.getImageData(0, 0, this._cv.width, this._cv.height));
    this._ctx.fillStyle = '#FFFFFF'; this._ctx.fillRect(0, 0, this._cv.width, this._cv.height);
  }

  renderVals() {
    const s = this.S();
    const weird = this.props.weird || 'odd';
    const icons = ICONS.map(ic => {
      let x = ic.x, y = ic.y;
      const m = s.moved[ic.id];
      if (m) { x = m.x; y = m.y; }
      if (s.carry === ic.id) { x = clamp(s.bx + 24, 0, 270); y = s.by - 34; }
      const stolen = s.stolen === ic.id;
      return {
        label: ic.label + (stolen ? ' (!)' : ''),
        aria: stolen ? ic.label + ', stolen by Bicho. Tap to get it back.' : ic.label,
        k1: ic.kind === 'k1', k2: ic.kind === 'k2', k3: ic.kind === 'k3', k4: ic.kind === 'k4', k5: ic.kind === 'k5', k6: ic.kind === 'k6',
        style: 'left:' + x + 'px;top:' + y + 'px' + (stolen ? ';filter:drop-shadow(0 0 8px #FF4FA3)' : ''),
        tap: () => this.tapIcon(ic.id)
      };
    });
    const bar = (v) => [1, 2, 3, 4, 5].map(i => ({ style: i <= v ? 'background:#000080' : 'background:#FFFFFF;box-shadow:inset 1px 1px 0 #808080' }));
    const asleep = s.mode === 'nap';
    const talking = !!s.sayEs && !asleep;
    const mood = asleep ? 'sleep' : s.happy > 0 ? 'happy' : talking ? 'talk' : 'idle';
    const sky = weird === 'haunted' ? 'linear-gradient(180deg,#F7A8CF 0%,#F9D6E6 55%,#FFE9F4 70%)' : OUTLINE_SKY;
    const hills = weird === 'haunted'
      ? 'radial-gradient(ellipse 360px 190px at 25% 98%,#3F9C7A 69%,transparent 70%),radial-gradient(ellipse 420px 210px at 88% 100%,#2F8566 69%,transparent 70%)'
      : 'radial-gradient(ellipse 360px 190px at 25% 98%,#8FDB4A 69%,transparent 70%),radial-gradient(ellipse 420px 210px at 88% 100%,#5BBB2E 69%,transparent 70%)';
    const ov = weird === 'haunted' ? 'radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(60,20,70,0.55))' : weird === 'odd' ? 'repeating-linear-gradient(0deg,rgba(11,42,74,0.05) 0 2px,transparent 2px 4px)' : 'transparent';
    const above = s.by > 230;
    const stolenIc = ICONS.find(i => i.id === s.stolen);
    const hint = s.flash || (stolenIc ? 'Bicho took ' + stolenIc.label + '. Tap the file to get it back.' : 'Tap Bicho for a bit of mischief, or let it loose below.');
    const hot = !!s.flash || !!stolenIc;
    const tools = TOOLS.map(t => ({
      label: t.id === 'stamp' ? ['esfera', 'cubo', 'cono', 'pirámide'][s.stamp % 4] : t.label,
      aria: t.label + (t.id === 'stamp' ? ' (tap again to change the shape)' : ''),
      sel: s.tool === t.id,
      style: s.tool === t.id ? 'background:#FFE766;transform:translateY(2px);box-shadow:0 1px 0 #0B2A4A' : '',
      i1: t.id === 'pencil', i2: t.id === 'brush', i3: t.id === 'spray', i4: t.id === 'eraser', i5: t.id === 'stamp',
      tap: () => { const cur = this.S(); if (t.id === 'stamp' && cur.tool === 'stamp') this.setState({ stamp: cur.stamp + 1 }); else this.setState({ tool: t.id }); }
    }));
    const palette = PALETTE.map((c, i) => ({
      sel: s.color === c, aria: PNAMES[i] + ' paint',
      style: 'background:' + c + (s.color === c ? ';transform:translateY(-4px);box-shadow:0 4px 0 #0B2A4A' : ''),
      tap: () => this.setState({ color: c })
    }));
    const pages = PAGES.map(pg => ({
      label: pg.label, sel: s.page === pg.id,
      style: s.page === pg.id ? 'background:#fff;position:relative;top:1px;min-height:32px' : '',
      tap: () => this.setPage(pg.id)
    }));
    const notesOpen = s.panel === 'notes';
    const drawOpen = s.panel === 'draw';
    const sunCx = 281, sunCy = 440;
    return {
      skyBg: hills + ',' + sky,
      weird: weird, fxMode: weird === 'haunted' ? 'full' : 'light', noMotion: !!this._reduce, loose: !!s.loose && !this._reduce,
      ovBg: ov, ghostOp: weird === 'cozy' ? 0 : 0.9, fernOp: weird === 'cozy' ? 0 : 1,
      sunEyes: weird !== 'cozy', sunX: clamp((s.bx + 40 - sunCx) / 150, -1, 1), sunY: clamp((s.by + 43 - sunCy) / 80, -1, 1),
      hint: hint, hintBg: hot ? '#FFFF80' : '#FFFFE1',
      icons: icons,
      hasSay: !!s.sayEs, hasSub: !!s.sayEn, sayEs: s.sayEs, sayEn: s.sayEn,
      bubbleStyle: 'position:absolute;width:196px;box-sizing:border-box;background:rgba(255,255,255,0.96);border:2.5px solid #0B2A4A;border-radius:14px;box-shadow:0 4px 0 #0B2A4A;padding:6px 10px;left:' + clamp(s.bx - 60, 8, 150) + 'px;top:' + (above ? s.by - 78 : s.by + 90) + 'px',
      bStyle: 'position:absolute;left:' + s.bx + 'px;top:' + s.by + 'px;transform:scaleX(' + s.flip + ')',
      mood: mood, look: s.bx < 150 ? 0.8 : -0.8, halo: false,
      stats: [
        { name: 'Hambre', blocks: bar(s.hunger), note: 'words' },
        { name: 'Ánimo', blocks: bar(s.joy), note: 'speaking' },
        { name: 'Energía', blocks: bar(s.energy), note: 'rest' }
      ],
      coins: s.coins,
      clock: (weird !== 'cozy' && (weird === 'haunted' || s.glitch)) ? '3:33' : '14:02',
      showNotes: notesOpen, showDraw: drawOpen,
      tabNotesStyle: 'top:190px;right:' + (notesOpen ? 252 : 0) + 'px' + (notesOpen ? ';background:#FFFFFF' : ''),
      tabDrawStyle: 'top:306px;right:' + (drawOpen ? -40 : 0) + 'px;opacity:' + (drawOpen ? 0 : 1),
      tools: tools, palette: palette, pages: pages, noteText: s.notes[s.page],
      toggleLoose: () => this.toggleLoose(),
      tapBicho: () => this.tapBicho(), feed: () => this.feed(), play: () => this.play(), sleep: () => this.sleep(),
      toggleNotes: () => this.openPanel('notes'), toggleDraw: () => this.openPanel('draw'), closePanel: () => this.closePanel(),
      onNote: (e) => this.onNote(e), setCv: (el) => this.setCv(el),
      pDown: (e) => this.pDown(e), pMove: (e) => this.pMove(e), pUp: () => this.pUp(),
      undo: () => this.undoOne(), wipe: () => this.wipe()
    };
  }
}
