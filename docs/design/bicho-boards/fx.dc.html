<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camcorder Overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:{{w}}px;height:{{h}}px;pointer-events:none;overflow:hidden">
<svg width="{{w}}" height="{{h}}" style="position:absolute;left:0;top:0;mix-blend-mode:overlay;opacity:{{grainOp}}" aria-hidden="true">
<filter id="fxNoise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
<rect width="{{w}}" height="{{h}}" filter="url(#fxNoise)"/>
</svg>
<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,{{scanOp}}) 0 1px,transparent 1px 3px)"></div>
<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,{{vigCol}} 100%)"></div>
<div style="position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,rgba(0,229,229,0.2),transparent)"></div>
<div style="position:absolute;right:0;top:0;bottom:0;width:6px;background:linear-gradient(270deg,rgba(255,31,169,0.2),transparent)"></div>
<div style="position:absolute;left:10px;bottom:{{stampB}}px;font-family:'VT323',monospace;font-size:19px;line-height:1;color:#F4F4D0;text-shadow:-0.7px 0 rgba(0,229,229,0.7),0.7px 0 rgba(255,31,169,0.7);white-space:nowrap">PLAY ▶ &nbsp;{{stamp}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":390,"min":40,"max":3000},"h":{"editor":"int","default":844,"min":40,"max":3000},"mood":{"editor":"enum","options":["cozy","odd","haunted"],"default":"odd"},"stamp":{"editor":"text","default":"PM 6:32 · 9 DÍAS"},"stampB":{"editor":"int","default":52,"min":0,"max":400},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood || 'odd';
    const lvl = mood === 'cozy' ? 0 : mood === 'odd' ? 1 : 2;
    return {
      w: Number(this.props.w || 390), h: Number(this.props.h || 844),
      grainOp: [0.06, 0.14, 0.24][lvl], scanOp: [0.03, 0.07, 0.12][lvl],
      vigCol: ['rgba(30,0,60,0.2)', 'rgba(30,0,60,0.38)', 'rgba(50,0,70,0.6)'][lvl],
      trkOp: [0, 1, 1][lvl],
      stamp: this.props.stamp || 'PM 6:32 · 9 DÍAS',
      stampB: Number(this.props.stampB === undefined ? 52 : this.props.stampB)
    };
  }
}
</script>
</body>
</html>
