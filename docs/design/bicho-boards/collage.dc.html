<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":390,"min":40,"max":3000},"h":{"editor":"int","default":844,"min":40,"max":3000},"fx":{"editor":"enum","options":["full","light","none"],"default":"full"},"mood":{"editor":"enum","options":["cozy","odd","haunted"],"default":"odd"},"lookX":{"editor":"float","default":0,"min":-1,"max":1,"step":0.1},"lookY":{"editor":"float","default":0,"min":-1,"max":1,"step":0.1},"skySrc":{"editor":"text","default":"","section":"Photos"},"playSrc":{"editor":"text","default":"","section":"Photos"},"officeSrc":{"editor":"text","default":"","section":"Photos"},"eyeSrc":{"editor":"text","default":"","section":"Photos"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w || 390);
    const h = Number(this.props.h || 844);
    const fx = this.props.fx || 'full';
    const mood = this.props.mood || 'odd';
    const k = Math.max(w / 390, h / 844);
    const tx = (w - 390 * k) / 2, ty = (h - 844 * k) / 2;
    const sat = mood === 'cozy' ? 1.1 : mood === 'odd' ? 1.35 : 1.7;
    const hue = mood === 'haunted' ? ' hue-rotate(-12deg)' : '';
    const tail = ' saturate(' + sat + ') contrast(1.06)' + hue;
    const post = fx === 'full' ? 'url(#cvPix) url(#cvRgb)' + tail : fx === 'light' ? 'url(#cvRgb)' + tail : 'none';
    const sky = mood === 'haunted' ? ['#5B1FA8', '#FF5FB5', '#FFD27A'] : ['#0B63FF', '#4DB8FF', '#FFC6EE'];
    const grass = mood === 'haunted' ? ['#2FB090', '#0E6A5A'] : ['#3AE05A', '#0B8A30'];
    const lx = Number(this.props.lookX || 0), ly = Number(this.props.lookY || 0);
    const has = (v) => !!(v && String(v).length > 4);
    const src = (v, d) => has(v) ? String(v) : (d || 'about:blank');
    const dSky = '/_blob/0bce3c0e2a764461caec4152884a6c08', dPlay = '/_blob/80d34e8bf27adb0714d411122ca2a012', dFloor = '/_blob/ed6e073075bad7718c70163370fedbd3';
    const playOn = true, floorOn = true;
    return {
      w: w, h: h, post: post,
      xf: 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')',
      skyA: sky[0], skyB: sky[1], skyC: sky[2], grassA: grass[0], grassB: grass[1],
      lookX: lx, lookY: ly,
      skySrc: src(this.props.skySrc, dSky), skyOp: 1, cloudOp: 0, vecOp: 0, vecFloorOp: 0,
      playSrc: src(this.props.playSrc, dPlay), playOp: 1,
      officeSrc: src(this.props.officeSrc, dFloor), officeOp: 1,
      eyeSrc: src(this.props.eyeSrc), eyeOp: has(this.props.eyeSrc) ? 1 : 0,
      ix: Math.max(-9, Math.min(9, lx * 9)), iy: Math.max(-3.5, Math.min(3.5, ly * 3.5))
    };
  }
}
</script>
